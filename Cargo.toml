[package]
name = "eco-pixel"
version = "0.1.0"
edition = "2024"

[lib]
crate-type = ["cdylib"]

[dependencies]
wasm-bindgen = "0.2"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "bmp", "tiff"] }
gif = "0.13"
zenwebp = { version = "0.4", default-features = false, features = ["std"] }

[profile.release]
opt-level = 3      # use "s" if bundle size matters more than speed
lto = true
codegen-units = 1
panic = "abort"

[dev-dependencies]
wasm-bindgen-test = "=0.3"